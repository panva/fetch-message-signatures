name: Release fetch-message-signatures

permissions: {}

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  release:
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: write
      discussions: write
      id-token: write
    uses: panva/.github/.github/workflows/npm-release.yml@bd045b0d7d15f7827910cdedd3e7f0570bc5bf58
    with:
      artifact_check_command: node tools/test-dist.js "$PACKAGE_TARBALL"
      cleanup_paths: '["index.js","index.d.ts","index.d.ts.map"]'
