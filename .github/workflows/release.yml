name: Release fetch-message-signatures

permissions: {}

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  release:
    permissions:
      actions: read # Download the package artifact.
      attestations: write # Publish package attestations.
      artifact-metadata: write # Record attested package metadata.
      contents: write # Update release branches and publish GitHub Releases.
      discussions: write # Create release discussions.
      id-token: write # Authenticate npm trusted publishing and sign attestations.
    uses: panva/.github/.github/workflows/npm-release.yml@3faba8af3880247be43547787aedd52780c9f946
    with:
      artifact_check_command: node tools/test-dist.js "$PACKAGE_TARBALL"
      cleanup_paths: '["index.js","index.d.ts","index.d.ts.map"]'
